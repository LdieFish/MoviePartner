spring:
  application:
    name: app
  # session
  session:
    store-type: redis
    # 30 days expire
    timeout: 2592000
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/movie_partner
    username: root
    password: root
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      ttl: 3600
      password:
server:
  port: 8082
  servlet:
    context-path: /api
    # 30 days expire
    session:
      cookie:
        max-age: 2592000
# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://token-plan-cn.xiaomimimo.com/v1
      api-key: <Your API Key>
      model-name: mimo-v2.5-pro
      max-tokens: 8192
      log-requests: true
      log-responses: true
    streaming-chat-model:
      base-url: https://token-plan-cn.xiaomimimo.com/v1
      api-key: <Your API Key>
      model-name: mimo-v2.5-pro
      max-tokens: 8192
      log-requests: true
      log-responses: true
    # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
      base-url: https://token-plan-cn.xiaomimimo.com/v1
      api-key: <Your API Key>
      model-name: mimo-v2.5-pro
      max-tokens: 32768
      temperature: 0.1
      log-requests: true
      log-responses: true
    # 智能路由 AI 模型配置
    routing-chat-model:
      base-url: https://token-plan-cn.xiaomimimo.com/v1
      api-key: <Your API Key>
      model-name: mimo-v2.5
      max-tokens: 100
      log-requests: true
      log-responses: true
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.movie.moviecompanion.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
