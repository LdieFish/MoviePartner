spring:
  application:
    name: movie-partner
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/movie_partner
    username: root
    password: root
server:
  port: 8080
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.movie.moviecompanion.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

